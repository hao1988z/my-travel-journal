<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅途日記 · Private Cloud</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>旅途日記</span>
    </div>
    <div class="topbar-actions">
      <span class="privacy-pill" id="sessionStatus">私人雲端</span>
      <button class="btn btn-ghost" id="signOutBtn" hidden>登出</button>
      <button class="btn btn-primary" id="newTripBtn" hidden>新增旅途</button>
    </div>
  </header>

  <section class="auth-screen" id="authScreen">
    <div class="auth-panel">
      <p class="eyebrow">Private Travel Journal</p>
      <h1>把旅行照片、日記和地圖足跡放進自己的私人雲端。</h1>
      <p class="auth-copy">登入後，照片會上傳到 Supabase private bucket。未開啟分享的人看不到，也不能下載。</p>
      <form class="auth-form" id="authForm">
        <label>
          Email
          <input type="email" id="emailInput" placeholder="you@example.com" required>
        </label>
        <label>
          密碼
          <input type="password" id="passwordInput" placeholder="至少 6 個字元" minlength="6" required>
        </label>
        <div class="auth-buttons">
          <button class="btn btn-primary" type="submit" data-auth-mode="signin">登入</button>
          <button class="btn btn-soft" type="button" id="signUpBtn">建立帳號</button>
        </div>
      </form>
      <p class="setup-note" id="setupNote"></p>
    </div>
  </section>

  <main class="app-shell" id="appShell" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>我的旅途</h2>
        <input type="search" id="searchInput" placeholder="搜尋地點、日期、心情...">
      </div>
      <div class="stats-row">
        <span><strong id="placeCount">0</strong> 個地點</span>
        <span><strong id="photoCount">0</strong> 張照片</span>
      </div>
      <div class="trip-list" id="tripList"></div>
    </aside>

    <section class="map-panel">
      <div id="map"></div>
      <article class="detail-drawer" id="detailDrawer" hidden>
        <div class="drawer-head">
          <h3 id="drawerTitle">旅途詳情</h3>
          <button class="icon-btn" id="closeDrawerBtn" aria-label="關閉">×</button>
        </div>
        <div id="drawerBody"></div>
      </article>
    </section>
  </main>

  <dialog class="trip-dialog" id="tripDialog">
    <form method="dialog" class="trip-form" id="tripForm">
      <div class="dialog-head">
        <h3 id="dialogTitle">新增旅途</h3>
        <button class="icon-btn" type="button" id="closeDialogBtn" aria-label="關閉">×</button>
      </div>

      <label class="photo-picker">
        <span>照片</span>
        <input type="file" id="photoInput" accept="image/*">
        <img id="photoPreview" alt="" hidden>
      </label>

      <div class="form-grid">
        <label>
          旅途標題
          <input type="text" id="titleInput" placeholder="京都秋日漫遊">
        </label>
        <label>
          日期
          <input type="date" id="dateInput">
        </label>
      </div>

      <label>
        地點名稱
        <input type="text" id="locationInput" placeholder="京都清水寺" required>
      </label>

      <div class="form-grid">
        <label>
          緯度
          <input type="number" id="latInput" step="0.000001" placeholder="35.00365">
        </label>
        <label>
          經度
          <input type="number" id="lngInput" step="0.000001" placeholder="135.77879">
        </label>
      </div>

      <label>
        心情
        <select id="moodInput">
          <option value="">選一個心情</option>
          <option>😄 開心</option>
          <option>😊 放鬆</option>
          <option>😌 平靜</option>
          <option>🥰 喜歡</option>
          <option>😮 驚喜</option>
          <option>🤩 難忘</option>
          <option>😴 疲憊</option>
        </select>
      </label>

      <label>
        日記
        <textarea id="diaryInput" placeholder="寫下這段旅程的氣味、天氣、遇見的人，或當時的自己。"></textarea>
      </label>

      <label>
        標籤
        <input type="text" id="tagsInput" placeholder="美食, 古蹟, 海邊">
      </label>

      <fieldset class="permissions">
        <legend>分享權限</legend>
        <label><input type="checkbox" id="sharedInput"> 開啟分享連結</label>
        <label><input type="checkbox" id="downloadInput"> 允許分享對象下載照片</label>
        <label><input type="checkbox" id="guestUploadInput"> 允許分享對象補照片</label>
      </fieldset>

      <div class="dialog-actions">
        <button class="btn btn-soft" type="button" id="deleteTripBtn" hidden>刪除</button>
        <button class="btn btn-primary" type="submit">儲存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
